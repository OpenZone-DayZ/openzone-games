# Portable half of the profile for dayz-agentic-modding-mcp.
# Machine paths live in dayz-mcp.local.toml, which is not committed.
#
# OpenZone_Games REQUIRES @OpenZone_Core (requiredAddons), and the core
# requires CF.

[project]
name = "openzone-games"

[build]
# OpenZone_Games         -- the mod. Phase 1: the rules of the games, nothing in
#                           the world yet.
# OpenZone_Games_Bridge  -- server only: the `oz_games` verb for the MCP bridge
#                           (a game played by script). A stand tool, never
#                           published. It joins `mods` when its folder exists:
#                           the MCP refuses a project that names a missing one.
# TableGamesProbe        -- client + server stand tool of 2026-11-23: the rays,
#                           the ring of places, the live hologram's report.
# TableGamesProbe_Bridge -- server only: the `tgp` verb.
# OpenZone_Games_VPP     -- the module "Ігри" of the OpenZone admin window (settings,
#                           card sharping, poses), a glue pbo that hard-requires VPP
#                           Admin Tools and the core's OpenZone_VPP. It is in `mods`
#                           because this stand loads both (dayz-mcp.local.toml); a
#                           machine without them takes it out again.
mods = ["OpenZone_Games", "OpenZone_Games_VPP", "OpenZone_Games_Bridge", "TableGamesProbe", "TableGamesProbe_Bridge"]
# The css2layout demos (`_demo_*.layout`, ignored by git) are written beside the pages they
# show, inside OpenZone_Games_VPP; the game never loads them, so they stay out of the pbo.
# `exclude` replaces the MCP's default list, which is repeated here; `stage` packs a copy
# without them instead of refusing the build.
exclude = [".git", "*.blend", "*.blend1", ".gitignore", ".gitattributes", "README.md", "*.ps1", "_demo_*.layout"]
stage = true
# The mod's own models (OpenZone_Games/models/<model>): the binarized .p3d, its
# model.cfg and data/ are committed there; their MLOD sources are in models/<model>/.
# binarize has no root switch: the root is its working directory, and every path
# baked into a model resolves against it. models/prepare_model_root.py stages the
# sources under build/model-root; one model is then built and put into the mod by
# asset_build(mod="OpenZone_Games", source="models/<model>").
project_root = "build/model-root"

[expect]
# Printed by OZG_Module one tick after the mission starts.
ready_line   = "games loaded"
max_warnings = 0
forbid       = ["Bad type", "Can't compile", "NULL pointer to instance"]
# The engine's errors about our classes, and the mod's own ERROR lines:
# OZG_Log.Error prints a plain `SCRIPT :` line, which the first patterns miss.
error_regex  = ["SCRIPT\\s+\\(E\\).*OZG_", "SCRIPT\\s+\\(E\\).*TGP_", "\\[OpenZone/Games\\] ERROR"]
# The stand's shared profile has the core's Discord bridge switched on, and no
# bridge process runs for this project: the core says so on every boot. A state
# of this stand, not an event. The poses mod this stand may load beside ours
# (dayz-mcp.local.toml) warns of its missing Credits.json on every boot.
noise        = ["Bridge.Url is not https", "bridge: ", "scripts/Data/Credits.json"]

# Read from the ready line.
[expect.counters]
games    = 16
problems = 0
