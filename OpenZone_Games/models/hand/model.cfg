// Model configuration of ozg_hand.p3d: a fan of eight cards as held in one hand.
// binarize takes the class from CfgModels by the file's name.
//
// No skeleton and no animations. sections[] is what lets the config and the script
// reach a selection: each card is one, both of its sides, so that a card the player
// does not hold can be blanked and the rest can wear the back of the deck's style.
//     card1 ... card8  from the holder's left to the holder's right

class CfgModels
{
	class ozg_hand
	{
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {"card1", "card2", "card3", "card4", "card5", "card6", "card7", "card8"};
	};
};
