// Model configuration of the can of dice and of the dice laid out (boards and dice
// design). binarize takes the class from CfgModels by the file's name.
//
// No skeleton and no animations. sections[] is what lets the config reach a selection:
//     camo  every visible face: the hologram repaints it

class CfgModels
{
	class ozg_can
	{
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {"camo"};
	};
	class ozg_can_place
	{
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {"camo"};
	};
};
