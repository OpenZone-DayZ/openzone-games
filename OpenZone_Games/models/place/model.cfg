// Model configuration of ozg_place.p3d: the laid-out game, a mat with a deck on it.
// binarize takes the class from CfgModels by the file's name.
//
// No skeleton and no animations. sections[] is what lets the config and the script
// reach a selection at all: a selection that is not a section cannot be retextured.
//     camo  every visible face: hiddenSelections[0] of the hologram's class, which the
//           placement hologram repaints
//     deck  the deck on the mat: it wears the back of the deck the place was laid out from

class CfgModels
{
	class ozg_place
	{
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {"camo", "deck"};
	};
};
