// Model configuration of the 3-in-1 board, folded and laid out (boards and dice design).
// binarize takes the class from CfgModels by the file's name.
//
// No skeleton and no animations. sections[] is what lets the config reach a selection:
//     camo  every visible face: the look is put on through it

class CfgModels
{
	class ozg_board
	{
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {"camo"};
	};
	class ozg_board_open
	{
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {"camo"};
	};
};
