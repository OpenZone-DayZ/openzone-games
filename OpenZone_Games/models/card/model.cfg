// Model configuration of ozg_card.p3d: one playing card, as an item.
// binarize takes the class from CfgModels by the file's name.
//
// No skeleton and no animations. sections[] is what lets the config and the script reach a
// selection:
//     face  the card's face: the picture of that card in its deck's look
//     back  the card's back: the back of its deck

class CfgModels
{
	class ozg_card
	{
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {"face", "back"};
	};
};
