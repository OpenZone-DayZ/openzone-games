// Model configuration of ozg_mark.p3d: the mark on the floor where a player may sit down.
// binarize takes the class from CfgModels by the file's name.
//
// No skeleton and no animations. sections[] is what lets the config reach a selection:
//     camo  every face: the config recolours the mark through it

class CfgModels
{
	class ozg_mark
	{
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {"camo"};
	};
};
